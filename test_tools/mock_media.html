<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Mode — Mock Media Test Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 20px; }
    h1 { font-size: 1.3rem; margin-bottom: 16px; color: #aaa; }
    h2 { font-size: 1rem; margin: 16px 0 8px; color: #8b5cf6; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; }
    .panel { background: #1a1a2e; border-radius: 12px; padding: 16px; }

    video { width: 100%; border-radius: 8px; background: #000; }
    canvas { display: none; }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; transition: 0.15s;
    }
    button:hover { filter: brightness(1.15); }
    .btn-green { background: #22c55e; color: #fff; }
    .btn-red { background: #ef4444; color: #fff; }
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-purple { background: #8b5cf6; color: #fff; }
    .btn-gray { background: #4b5563; color: #fff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .log {
      background: #0d0d1a; border-radius: 8px; padding: 12px; margin-top: 12px;
      max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.75rem;
      line-height: 1.5;
    }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
    .log-time { color: #6b7280; }
    .log-info { color: #60a5fa; }
    .log-ok { color: #34d399; }
    .log-warn { color: #fbbf24; }
    .log-err { color: #f87171; }
    .log-data { color: #c4b5fd; }

    .state-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }

    input, select {
      background: #0d0d1a; color: #eee; border: 1px solid #333; border-radius: 6px;
      padding: 6px 10px; font-size: 0.85rem; width: 100%;
    }
    label { display: block; font-size: 0.75rem; color: #9ca3af; margin-bottom: 4px; }
    .field { margin-bottom: 10px; }

    .test-result { padding: 8px 12px; border-radius: 8px; margin: 4px 0; font-size: 0.8rem; }
    .test-pass { background: #065f46; color: #6ee7b7; }
    .test-fail { background: #7f1d1d; color: #fca5a5; }
    .test-running { background: #1e3a5f; color: #93c5fd; }

    #snapshot-preview {
      width: 160px; height: 120px; border-radius: 6px; border: 1px solid #333;
      object-fit: cover; margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Realtime Mode — Mock Media Test Harness</h1>

  <div class="grid">
    <!-- Left: Mock camera + voice controls -->
    <div>
      <div class="panel">
        <h2>Mock Camera Feed</h2>
        <video id="mock-video" autoplay playsinline muted></video>
        <canvas id="mock-canvas" width="640" height="480"></canvas>
        <img id="snapshot-preview" alt="Last snapshot" />
        <div class="controls">
          <button class="btn-green" onclick="startMockCamera()">Start Mock Camera</button>
          <button class="btn-red" onclick="stopMockCamera()">Stop Camera</button>
          <button class="btn-blue" onclick="captureAndPreview()">Capture Snapshot</button>
        </div>
        <div class="field" style="margin-top: 12px">
          <label>Scene preset</label>
          <select id="scene-select" onchange="changeScene()">
            <option value="board">Board game table</option>
            <option value="cards">Card close-up</option>
            <option value="dice">Dice roll</option>
            <option value="blank">Blank/dark</option>
          </select>
        </div>
      </div>

      <div class="panel" style="margin-top: 16px">
        <h2>Mock Voice Input</h2>
        <div class="field">
          <label>Simulated speech transcript</label>
          <input type="text" id="voice-input" value="Where should I place my settlement?" />
        </div>
        <div class="controls">
          <button class="btn-purple" onclick="simulateSpeech()">Simulate Speech (Final)</button>
          <button class="btn-gray" onclick="simulateInterim()">Simulate Interim</button>
          <button class="btn-gray" onclick="simulateNoSpeech()">Simulate no-speech Error</button>
        </div>
      </div>
    </div>

    <!-- Right: API testing + logs -->
    <div>
      <div class="panel">
        <h2>Realtime API Test</h2>
        <div class="field">
          <label>Game ID</label>
          <input type="text" id="game-id" value="catan" />
        </div>
        <div class="field">
          <label>Message</label>
          <input type="text" id="message-input" value="What should I do next?" />
        </div>
        <div class="field">
          <label>Session ID (leave empty for new)</label>
          <input type="text" id="session-input" value="" />
        </div>
        <div style="display:flex; align-items:center; gap: 12px;">
          <span>State:</span>
          <span id="state-badge" class="state-badge" style="background: #374151;">
            <span class="dot" style="background: #9ca3af;"></span> idle
          </span>
        </div>
        <div class="controls">
          <button class="btn-green" onclick="sendRealtimeRequest()">Send Realtime Request</button>
          <button class="btn-blue" onclick="sendWithImage()">Send with Snapshot</button>
          <button class="btn-purple" onclick="testTTS()">Test TTS</button>
        </div>
      </div>

      <div class="panel" style="margin-top: 16px">
        <h2>Automated Test Suite</h2>
        <div class="controls">
          <button class="btn-green" onclick="runAllTests()">Run All Tests</button>
          <button class="btn-gray" onclick="clearTestResults()">Clear Results</button>
        </div>
        <div id="test-results" style="margin-top: 12px;"></div>
      </div>

      <div class="panel" style="margin-top: 16px">
        <h2>Event Log</h2>
        <div class="controls">
          <button class="btn-gray" onclick="clearLog()">Clear Log</button>
        </div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>

<script>
// ======================== LOGGING ========================
const logEl = document.getElementById('log');

function log(msg, level = 'info') {
  const time = new Date().toLocaleTimeString('en-US', { hour12: false, fractionalSecondDigits: 3 });
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-time">${time}</span> <span class="log-${level}">${msg}</span>`;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() { logEl.innerHTML = ''; }

// ======================== STATE ========================
let currentState = 'idle';
let currentSessionId = null;

function setState(state) {
  currentState = state;
  const badge = document.getElementById('state-badge');
  const configs = {
    idle:       { bg: '#374151', dot: '#9ca3af', label: 'idle' },
    listening:  { bg: '#065f46', dot: '#34d399', label: 'listening' },
    processing: { bg: '#78350f', dot: '#fbbf24', label: 'processing' },
    speaking:   { bg: '#1e3a5f', dot: '#60a5fa', label: 'speaking' },
  };
  const c = configs[state] || configs.idle;
  badge.style.background = c.bg;
  badge.innerHTML = `<span class="dot" style="background:${c.dot}"></span> ${c.label}`;
}

// ======================== MOCK CAMERA ========================
let mockStream = null;
let animFrameId = null;
let currentScene = 'board';

const sceneColors = {
  board: { bg: '#d4a03c', fg: '#8b4513', label: 'CATAN BOARD' },
  cards: { bg: '#2563eb', fg: '#fff', label: 'CARD: +2 WHEAT' },
  dice:  { bg: '#16a34a', fg: '#fff', label: 'DICE: 7' },
  blank: { bg: '#111', fg: '#333', label: '' },
};

function startMockCamera() {
  const canvas = document.getElementById('mock-canvas');
  const ctx = canvas.getContext('2d');

  function drawFrame() {
    const scene = sceneColors[currentScene];
    ctx.fillStyle = scene.bg;
    ctx.fillRect(0, 0, 640, 480);

    // Draw mock board elements
    if (currentScene === 'board') {
      // Hexagonal tiles
      for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 4; j++) {
          ctx.fillStyle = ['#d4a03c', '#228b22', '#8b4513', '#cd853f', '#808080'][(i + j) % 5];
          ctx.beginPath();
          const x = 120 + i * 100 + (j % 2) * 50;
          const y = 120 + j * 90;
          for (let k = 0; k < 6; k++) {
            const angle = Math.PI / 3 * k - Math.PI / 6;
            const px = x + 45 * Math.cos(angle);
            const py = y + 45 * Math.sin(angle);
            k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#333';
          ctx.stroke();
        }
      }
    }

    // Label
    if (scene.label) {
      ctx.fillStyle = scene.fg;
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(scene.label, 320, 440);
    }

    // Timestamp (proves frames are live)
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '12px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(new Date().toISOString(), 630, 20);

    animFrameId = requestAnimationFrame(drawFrame);
  }

  drawFrame();

  // Create a MediaStream from canvas
  mockStream = canvas.captureStream(15);  // 15 FPS
  document.getElementById('mock-video').srcObject = mockStream;
  log('Mock camera started (canvas-based, 640x480 @ 15fps)', 'ok');
}

function stopMockCamera() {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  if (mockStream) mockStream.getTracks().forEach(t => t.stop());
  document.getElementById('mock-video').srcObject = null;
  log('Mock camera stopped', 'warn');
}

function changeScene() {
  currentScene = document.getElementById('scene-select').value;
  log(`Scene changed to: ${currentScene}`, 'info');
}

function captureSnapshot() {
  const canvas = document.getElementById('mock-canvas');
  return new Promise(resolve => {
    canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.6);
  });
}

async function captureAndPreview() {
  const blob = await captureSnapshot();
  if (!blob) { log('No snapshot — start camera first', 'err'); return; }
  const url = URL.createObjectURL(blob);
  document.getElementById('snapshot-preview').src = url;
  log(`Snapshot captured: ${(blob.size / 1024).toFixed(1)} KB`, 'ok');
}

// ======================== MOCK SPEECH RECOGNITION ========================

function simulateSpeech() {
  const text = document.getElementById('voice-input').value;
  log(`[STT] Final transcript: "${text}"`, 'ok');
  setState('processing');
  // Auto-send to API
  sendRealtimeWithText(text);
}

function simulateInterim() {
  const text = document.getElementById('voice-input').value;
  const partial = text.split(' ').slice(0, 3).join(' ') + '...';
  log(`[STT] Interim: "${partial}"`, 'info');
}

function simulateNoSpeech() {
  log('[STT] Error: no-speech — would auto-restart recognition', 'warn');
}

// ======================== API CALLS ========================

async function parseSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  const events = [];

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() ?? '';

    let currentEvent = 'message';
    for (const line of lines) {
      if (line.startsWith('event:')) {
        currentEvent = line.slice(6).trim();
      } else if (line.startsWith('data:')) {
        const data = line.slice(5).trim();
        events.push({ event: currentEvent, data });
        log(`[SSE] ${currentEvent}: ${data.substring(0, 80)}${data.length > 80 ? '...' : ''}`, 'data');
      }
    }
  }
  return events;
}

async function sendRealtimeWithText(message, includeImage = false) {
  const gameId = document.getElementById('game-id').value;
  const sessionId = document.getElementById('session-input').value || currentSessionId;

  setState('processing');
  const formData = new FormData();
  formData.append('message', message);
  if (sessionId) formData.append('session_id', sessionId);

  if (includeImage) {
    const blob = await captureSnapshot();
    if (blob) {
      formData.append('image', blob, 'snapshot.jpg');
      log(`Attached image: ${(blob.size / 1024).toFixed(1)} KB`, 'info');
    }
  }

  log(`POST /api/games/${gameId}/chat/realtime — "${message}"`, 'info');

  try {
    const res = await fetch(`/api/games/${gameId}/chat/realtime`, {
      method: 'POST',
      body: formData,
    });

    if (!res.ok) {
      log(`HTTP ${res.status}: ${await res.text()}`, 'err');
      setState('idle');
      return null;
    }

    const events = await parseSSE(res);
    let fullText = '';
    let sessionIdFromServer = null;

    for (const e of events) {
      if (e.event === 'chunk') {
        fullText += JSON.parse(e.data).text;
      } else if (e.event === 'done') {
        const d = JSON.parse(e.data);
        sessionIdFromServer = d.session_id;
      } else if (e.event === 'error') {
        log(`Agent error: ${JSON.parse(e.data).error}`, 'err');
      }
    }

    if (sessionIdFromServer) {
      currentSessionId = sessionIdFromServer;
      document.getElementById('session-input').value = sessionIdFromServer;
      log(`Session: ${sessionIdFromServer}`, 'ok');
    }

    log(`Full response (${fullText.length} chars): "${fullText.substring(0, 120)}"`, 'ok');
    setState('speaking');

    // Simulate speaking duration
    setTimeout(() => {
      setState('listening');
      log('Speaking complete — returning to listening', 'info');
    }, 1500);

    return { events, fullText, sessionId: sessionIdFromServer };
  } catch (err) {
    log(`Network error: ${err.message}`, 'err');
    setState('idle');
    return null;
  }
}

function sendRealtimeRequest() {
  const msg = document.getElementById('message-input').value;
  sendRealtimeWithText(msg, false);
}

function sendWithImage() {
  const msg = document.getElementById('message-input').value;
  sendRealtimeWithText(msg, true);
}

async function testTTS() {
  log('POST /api/tts — testing text-to-speech', 'info');
  try {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: 'Hello, I am your board game teacher.', voice: 'alloy' }),
    });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      log(`TTS failed: HTTP ${res.status} — ${detail.detail || 'unknown'}`, 'err');
      return;
    }
    const blob = await res.blob();
    log(`TTS response: ${(blob.size / 1024).toFixed(1)} KB audio/mpeg`, 'ok');

    // Play it
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => { URL.revokeObjectURL(url); log('TTS playback complete', 'ok'); };
    audio.play().catch(e => log(`Playback error: ${e.message}`, 'err'));
  } catch (err) {
    log(`TTS network error: ${err.message}`, 'err');
  }
}

// ======================== AUTOMATED TEST SUITE ========================

const testResultsEl = document.getElementById('test-results');

function addTestResult(name, passed, detail = '') {
  const div = document.createElement('div');
  div.className = `test-result ${passed ? 'test-pass' : 'test-fail'}`;
  div.textContent = `${passed ? 'PASS' : 'FAIL'} ${name}${detail ? ' — ' + detail : ''}`;
  testResultsEl.appendChild(div);
}

function setTestRunning(name) {
  const div = document.createElement('div');
  div.className = 'test-result test-running';
  div.id = `test-${name}`;
  div.textContent = `RUNNING ${name}...`;
  testResultsEl.appendChild(div);
  return div;
}

function clearTestResults() { testResultsEl.innerHTML = ''; }

async function runAllTests() {
  clearTestResults();
  log('=== Starting automated test suite ===', 'info');

  const tests = [
    testGameNotFound,
    testMissingMessage,
    testTextOnlyRequest,
    testTextWithImageRequest,
    testSessionCreation,
    testSessionReuse,
    testSSEFormat,
    testConversationContinuity,
    testTTSEndpoint,
    testStateTransitions,
  ];

  let passed = 0;
  let failed = 0;

  for (const test of tests) {
    const runner = setTestRunning(test.name);
    try {
      await test();
      runner.className = 'test-result test-pass';
      runner.textContent = `PASS ${test.name}`;
      passed++;
    } catch (err) {
      runner.className = 'test-result test-fail';
      runner.textContent = `FAIL ${test.name} — ${err.message}`;
      failed++;
      log(`Test failed: ${test.name}: ${err.message}`, 'err');
    }
  }

  log(`=== Tests complete: ${passed} passed, ${failed} failed ===`, passed === tests.length ? 'ok' : 'warn');
}

function assert(condition, msg) {
  if (!condition) throw new Error(msg);
}

// --- Individual tests ---

async function testGameNotFound() {
  const res = await fetch('/api/games/nonexistent_game_xyz/chat/realtime', {
    method: 'POST',
    body: (() => { const f = new FormData(); f.append('message', 'hi'); return f; })(),
  });
  assert(res.status === 404, `Expected 404, got ${res.status}`);
}

async function testMissingMessage() {
  const res = await fetch('/api/games/catan/chat/realtime', {
    method: 'POST',
    body: new FormData(),  // no message field
  });
  assert(res.status === 422, `Expected 422, got ${res.status}`);
}

async function testTextOnlyRequest() {
  const fd = new FormData();
  fd.append('message', 'Test text only');
  const res = await fetch('/api/games/catan/chat/realtime', { method: 'POST', body: fd });
  assert(res.ok, `HTTP ${res.status}`);
  const events = await parseSSE(res);
  const chunks = events.filter(e => e.event === 'chunk');
  const dones = events.filter(e => e.event === 'done');
  assert(chunks.length >= 1, 'No chunk events');
  assert(dones.length === 1, `Expected 1 done event, got ${dones.length}`);
}

async function testTextWithImageRequest() {
  // Create a small PNG blob
  const canvas = document.createElement('canvas');
  canvas.width = 100; canvas.height = 100;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#d4a03c'; ctx.fillRect(0, 0, 100, 100);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.5));

  const fd = new FormData();
  fd.append('message', 'What is this?');
  fd.append('image', blob, 'test.jpg');
  const res = await fetch('/api/games/catan/chat/realtime', { method: 'POST', body: fd });
  assert(res.ok, `HTTP ${res.status}`);
  const events = await parseSSE(res);
  assert(events.some(e => e.event === 'done'), 'No done event');
}

async function testSessionCreation() {
  const fd = new FormData();
  fd.append('message', 'Session test');
  const res = await fetch('/api/games/catan/chat/realtime', { method: 'POST', body: fd });
  assert(res.ok, `HTTP ${res.status}`);
  const events = await parseSSE(res);
  const done = events.find(e => e.event === 'done');
  assert(done, 'No done event');
  const data = JSON.parse(done.data);
  assert(data.session_id, 'No session_id in done event');
  assert(data.session_id.length > 10, 'session_id too short');
}

async function testSessionReuse() {
  // First request — get session
  const fd1 = new FormData();
  fd1.append('message', 'First');
  const res1 = await fetch('/api/games/catan/chat/realtime', { method: 'POST', body: fd1 });
  const events1 = await parseSSE(res1);
  const sid1 = JSON.parse(events1.find(e => e.event === 'done').data).session_id;

  // Second request — reuse session
  const fd2 = new FormData();
  fd2.append('message', 'Second');
  fd2.append('session_id', sid1);
  const res2 = await fetch('/api/games/catan/chat/realtime', { method: 'POST', body: fd2 });
  const events2 = await parseSSE(res2);
  const sid2 = JSON.parse(events2.find(e => e.event === 'done').data).session_id;

  assert(sid1 === sid2, `Session IDs differ: ${sid1} vs ${sid2}`);
}

async function testSSEFormat() {
  const fd = new FormData();
  fd.append('message', 'Format test');
  const res = await fetch('/api/games/catan/chat/realtime', { method: 'POST', body: fd });
  const events = await parseSSE(res);

  // Every event should have valid JSON data
  for (const e of events) {
    const data = JSON.parse(e.data);  // Should not throw
    if (e.event === 'chunk') assert('text' in data, 'chunk missing text field');
    if (e.event === 'done') {
      assert('session_id' in data, 'done missing session_id');
      assert('citations' in data, 'done missing citations');
    }
  }
}

async function testConversationContinuity() {
  // Send 3 messages in sequence and verify session persists
  let sid = null;
  for (let i = 0; i < 3; i++) {
    const fd = new FormData();
    fd.append('message', `Turn ${i + 1}`);
    if (sid) fd.append('session_id', sid);
    const res = await fetch('/api/games/catan/chat/realtime', { method: 'POST', body: fd });
    assert(res.ok, `Request ${i + 1} failed: HTTP ${res.status}`);
    const events = await parseSSE(res);
    const newSid = JSON.parse(events.find(e => e.event === 'done').data).session_id;
    if (sid) assert(newSid === sid, `Session changed on turn ${i + 1}`);
    sid = newSid;
  }
}

async function testTTSEndpoint() {
  const res = await fetch('/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: 'Test', voice: 'alloy' }),
  });
  // Expect 503 (no API key) or 200 (has API key)
  assert(res.status === 503 || res.status === 200, `Unexpected TTS status: ${res.status}`);
  if (res.status === 503) {
    const data = await res.json();
    assert(data.detail.includes('not configured'), 'Unexpected 503 message');
  }
}

async function testStateTransitions() {
  // This tests the frontend state machine logic conceptually
  const states = ['idle', 'listening', 'processing', 'speaking', 'listening'];
  const validTransitions = {
    idle: ['listening'],
    listening: ['processing', 'idle'],
    processing: ['speaking', 'listening', 'idle'],
    speaking: ['listening', 'idle'],
  };

  for (let i = 0; i < states.length - 1; i++) {
    const from = states[i];
    const to = states[i + 1];
    assert(
      validTransitions[from].includes(to),
      `Invalid transition: ${from} -> ${to}`
    );
  }
}

// ======================== INIT ========================
log('Test harness loaded. Start mock camera, then run tests.', 'info');
log('Note: API tests require the backend running on the same origin (use Vite proxy or run on :8000).', 'warn');
</script>
</body>
</html>
